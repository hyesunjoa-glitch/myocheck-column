# 글이 저장소(main)에 올라가면 자동으로: 사이트 만들기 → 공개 → 검색엔진에 새 글 알림
name: 칼럼 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 예약 발행: 매일 한국 시간 0시 10분(= UTC 15:10)에 사이트를 다시 만들어 그날 차례인 글을 올려요.
  #   (깃허브 사정으로 몇 분~몇 시간 늦거나 건너뛸 수 있어요. 그래서 같은 날 세 번 더 돌려요 — 몇 번 돌아도 결과는 같아요.
  #    저장소에 60일 동안 아무 변화가 없으면 깃허브가 이 예약을 멈춰요.)
  schedule:
    - cron: "10 15 * * *"   # 0:10 KST
    - cron: "47 16 * * *"   # 1:47 KST (예비)
    - cron: "23 21 * * *"   # 6:23 KST (예비)
    - cron: "37 0 * * *"    # 9:37 KST (예비)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown jinja2 pyyaml
      - name: 사이트 만들기 (승인 + 안전검사 통과한 글만)
        run: python build.py
      - name: 바뀐 주소 적어 두기 (IndexNow 준비)
        run: python scripts/indexnow.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-plan
          path: .indexnow-plan.json
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown jinja2 pyyaml
      - run: python build.py
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-plan
      - name: 검색엔진에 새 글 알리기
        run: python scripts/indexnow.py send
