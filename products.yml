reunion:
  name: 묘화의 재회막차
  chip_top: 재회
  chip: 연락 올까?
  character: myohwa
  edition: "연락 타이밍 : 골든타임편"
  tag: 재회
  image: static/img/reunion-lastbus.jpg
  button: 묘화의 재회막차 보러 가기
  hook: 다시 연락이 올 시기와 가능성, 사주로 확인해 보세요.
  float_line: 그 사람 연락, 언제쯤일까?
  question: 그 사람 연락, 언제쯤 올까?      # 함께 보면 좋은 사주 카드에 크게 들어가는 한 줄
  url: "https://www.myocheck.kr/f/cmujwoetf000104lfp1dzc61l?step=step_intro"

  # 📑 결과지 목차 — 상품마다 한 번만 적어요. 칼럼은 report_chapter: 숫자 로 "이 질문에 답하는 장"만 가리켜요.
  #    gives: 그 장에서 실제로 받는 것 (결과지 소제목 그대로)
  toc:   # 타이탄 사주 결과지 구성 그대로 옮김 (2026-10-04 확인)
    - chapter: 1
      title: 왜 매번 여기서 멈추나
      gives:
        - 헤어지던 그 날 무슨 일이 있었는지
        - 그 전에도 똑같은 일이 있었는지
        - 그 사람 문제인지, 내가 문제인지?
    - chapter: 2
      title: 잘 맞던 자리, 깨지던 자리
      gives:
        - 두 사람이 원래 잘 통하던 부분
        - 늘 같은 말에서 틀어지던 부분
        - 서로 부딪히기 쉬운 방식의 차이
    - chapter: 3
      title: 지금 연락하면 어떻게 되나
      gives:
        - 지금 보냈을 때 흔히 생기는 흐름
        - 어디쯤에서 막히는지
        - 지금 말고 다른 때는 뭐가 달라지는지
    - chapter: 4
      title: 지금이 그때인가
      gives:
        - 다가갈 때·기다릴 때·접을 때 중 지금은 어디?
        - 그렇게 본 이유
        - 이 판단이 언제까지 유효한지
    - chapter: 5
      title: 첫 마디와 하면 안 되는 것
      gives:
        - 첫 연락에 뭐라고 보낼지 (문장 그대로)
        - 절대 하면 안 되는 다섯 가지
        - 답이 왔을 때 / 안 왔을 때 다음 한마디
    - chapter: 6
      title: 언제 다시 보나
      gives:
        - 다음에 다시 확인할 시기
        - 이게 보이면 멈춰야 하는 신호
        - 멈춘 뒤에는 뭘 하고 지낼지
  delivery: 결제 후 10분 안에 결과지 전달

  # ❓ 사주 보기 전 질문 — 진행 순서·준비물·가격·개인정보를 여기서 한 번에 답해요
  buy_faq:
    - q: 어떻게 진행되나요?
      steps:
        - icon: "✍️"
          step: 정보 넣기
          text: 이름, 생년월일, 태어난 시간, 성별을 넣어요. 1분이면 돼요.
        - icon: "💳"
          step: 결제
          text: 결제하면 바로 풀이가 시작돼요.
        - icon: "📩"
          step: 결과지 받기
          text: 결제 후 10분 안에 결과지가 바로 전달돼요.
    - q: 어떤 정보가 필요한가요?
      a: 내 이름, 생년월일(양력·음력 선택), 태어난 시간, 성별이에요. 그다음 화면에서 상대와 상황에 대한 질문이 이어져요.
    - q: 태어난 시간을 몰라도 볼 수 있나요?
      a: 네. 입력 화면에서 "시간 모름"을 고르면 돼요. 시간을 알면 조금 더 자세히 볼 수 있어요.
    - q: 그 사람 생일을 모르면 어떻게 해요?
      a: 그 사람 생년월일은 꼭 있어야 해요. 두 사람 사주를 나란히 놓고 보는 풀이라서, 생년월일이 없으면 결과지를 만들 수 없어요. 태어난 시간은 몰라도 괜찮아요.
    - q: 가격은 얼마인가요?
      a: "지금은 29,900원이에요. (정가 49,900원) 할인 가격은 바뀔 수 있어서, 정확한 금액은 상품 화면에서 한 번 더 확인해 주세요."
    - q: 내 정보는 어떻게 보관되나요?
      a: 입력한 정보는 결과지를 만드는 데만 쓰고, 다른 곳에 보내지 않아요. 자세한 내용은 묘책 개인정보 보호방침에서 볼 수 있어요.

  # ⭐ 실제 후기만 — 비어 있으면 정식 사이트에서는 후기 칸을 숨겨요
  reviews: []

