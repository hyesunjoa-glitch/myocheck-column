  toc:
    - chapter: 0
      title: 지금 핀 꽃
      gives:
        - 지금 둘의 온도
        - 지금 가장 선명한 색
        - 두 사람의 애정과 표현 속도
    - chapter: 1
      title: 너의 계절
      gives:
        - 나는 사랑할수록 어떤 사람이 되는지
        - 내가 연인에게 가장 바라는 것
        - 좋아질수록 내가 예민해지는 지점
    - chapter: 2
      title: 그 사람의 계절
      gives:
        - 그 사람은 사랑할수록 어떻게 달라지는지
        - 그 사람이 사랑받는다고 느끼는 방식
        - 그 사람이 부담을 느끼는 상황
    - chapter: 3
      title: 같은 화분에 심으면
      gives:
        - 왜 우리는 서로에게 끌렸을까
        - 둘이 함께 있을 때 유독 잘 맞는 것
        - 같은 행동, 서로 다르게 받아들이는 지점
    - chapter: 4
      title: 다음 철의 색
      gives:
        - 갈수록 지금보다 더 좋아지는 것
        - 오래 만나야 보이는 서로의 모습
        - 우리 둘이 함께라서 생기는 새로운 강점
    - chapter: 5
      title: 계절이 바뀔 때
      gives:
        - 익숙해지면 먼저 달라지는 것
        - 좋았던 부분이 서운함이 되는 순간
        - 오래 만날수록 맞춰가야 할 지점
    - chapter: 6
      title: 오래 피우는 법
      gives:
        - 싸웠을 때 어떻게 풀어야 잘 맞는지
        - 서로에게 필요한 애정 표현은?
        - 관계를 오래 유지하는 중요한 조건
