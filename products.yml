# ─────────────────────────────────────────────
# 칼럼에 연결할 묘책 상품 목록
#   - 글마다 frontmatter의 product: 에 아래 키(reunion 등)를 적어요.
#   - 글의 "연결 상품"에 [○○ 대기]가 하나라도 남아 있으면 그 글은 발행되지 않아요. (안전장치)
#   - 다른 상품은 글 아래 "함께 보면 좋은 사주" 줄에 나와요. 링크가 없으면 그 줄에서만 빠져요.
# ─────────────────────────────────────────────

reunion:
  name: 묘화의 재회막차
  edition: "연락 타이밍 : 골든타임편"
  tag: 재회
  image: static/img/reunion-lastbus.jpg
  button: 묘화의 재회막차 보러 가기
  hook: 다시 연락이 올 시기와 가능성, 사주로 확인해 보세요.
  float_line: 그 사람 연락, 언제쯤일까?
  url: "https://www.myocheck.kr/f/cmujwoetf000104lfp1dzc61l?step=step_intro"

  # 📑 결과지 목차 — 상품마다 한 번만 적어요. 칼럼은 report_chapter: 숫자 로 "이 질문에 답하는 장"만 가리켜요.
  #    gives: 그 장에서 실제로 받는 것 (결과지 소제목 그대로)
  toc:
    - chapter: 1
      title: 왜 매번 여기서 멈추나
      gives:
        - 헤어지던 그 날 무슨 일이 있었는지
        - 그 전에도 똑같은 일이 있었는지
    - chapter: 2
      title: 잘 맞던 자리, 깨지던 자리
      gives:
        - 두 사람이 원래 잘 통하던 부분
        - 늘 같은 말에서 틀어지던 부분
        - 서로 부딪히기 쉬운 방식의 차이
    - chapter: 3
      title: "[3장 제목 대기]"
      gives: []
    - chapter: 4
      title: "[4장 제목 대기]"
      gives: []
    - chapter: 5
      title: 첫 마디와 하면 안 되는 것
      gives:
        - 첫 연락에 뭐라고 보낼지 (문장 그대로)
        - 답이 왔을 때 / 안 왔을 때 다음 한마디
  delivery: 결제 후 10분 안에 결과지 전달

  # ❓ 사주 보기 전 질문 — 진행 순서·준비물·가격·개인정보를 여기서 한 번에 답해요
  buy_faq:
    - q: 어떻게 진행되나요?
      steps:
        - icon: "✍️"
          step: 정보 넣기
          text: 이름, 생년월일, 태어난 시간, 성별을 넣어요. 1분이면 돼요.
        - icon: "💳"
          step: 결제
          text: 결제하면 바로 풀이가 시작돼요.
        - icon: "📩"
          step: 결과지 받기
          text: 결제 후 10분 안에 결과지가 바로 전달돼요.
    - q: 어떤 정보가 필요한가요?
      a: 내 이름, 생년월일(양력·음력 선택), 태어난 시간, 성별이에요. 그다음 화면에서 상대와 상황에 대한 질문이 이어져요.
    - q: 태어난 시간을 몰라도 볼 수 있나요?
      a: 네. 입력 화면에서 "시간 모름"을 고르면 돼요. 시간을 알면 조금 더 자세히 볼 수 있어요.
    - q: 그 사람 생일을 모르면 어떻게 해요?
      a: "[답변 대기]"
    - q: 가격은 얼마인가요?
      a: "[가격 대기]"
    - q: 내 정보는 어떻게 보관되나요?
      a: 입력한 정보는 결과지를 만드는 데만 쓰고, 다른 곳에 보내지 않아요. 자세한 내용은 묘책 개인정보 보호방침에서 볼 수 있어요.

  # ⭐ 실제 후기만 — 비어 있으면 정식 사이트에서는 후기 칸을 숨겨요
  reviews: []

breakup:
  name: 인형의 방
  edition: "이별 원인 : 헤어진 이유편"
  tag: 이별 원인
  image: static/img/inhyeong-room.jpg
  button: 우리가 헤어진 진짜 이유 보기
  hook: 같은 이별을 반복하지 않으려면, 이유부터 알아야 해요.
  float_line: 우리는 왜 헤어졌을까?
  url: "https://www.myocheck.kr/f/cmte4ye1u000104jjhrofyz04?step=step_intro"

  # 📑 결과지 목차 — 사장님이 준 결과지 이미지(2026-10-04) 그대로. 5장은 뺐어요.
  toc:
    - chapter: 1
      title: 두 사람의 실
      gives:
        - 누가 더 많이 좋아했는지
        - 누가 관계를 더 유지하려 했는지
        - 반복되던 갈등은 무엇이었는지
    - chapter: 2
      title: 처음 묶인 자리
      gives:
        - 처음 문제가 생긴 이유
        - 상대의 태도가 달라진 시점
        - 결정적 사건이 있었던 날
    - chapter: 3
      title: 먼저 닳은 쪽
      gives:
        - 누가 먼저 마음의 거리를 뒀는지
        - 이별 전 어떤 신호를 보냈는지
        - 결정적 사건이 있었던 날
    - chapter: 4
      title: 결국 반복된 문제
      gives:
        - 헤어지기 전, 계속 쌓이고 있던 것
        - 상대가 계속 힘들어했던 부분
        - 결국 관계를 지치게 만든 패턴
    - chapter: 6
      title: 정말 마음이 끝난 걸까
      gives:
        - 이별 후에도 남아 있는 감정
        - 상대가 흔들릴 수 있는 지점
        - 다시 생각날 수밖에 없는 이유
  delivery: 결제 후 10분 안에 결과지 전달   # 재회막차와 같다고 보고 적음(추정) — 다르면 고쳐 주세요

  # ❓ 사주 보기 전 질문 — 재회막차와 같은 진행 순서로 보고 적음(추정). 가격은 대기.
