      a: 아니요. 사주는 두 사람의 성향과 흐름을 해석한 참고 자료라, 그 사람 마음을 단정하지 않아요. 왜 그렇게 흘렀는지 이해하는 데 써 주세요.
    - q: 유리는 누구예요?
      a: 묘책에서 이별 원인을 맡은 캐릭터예요. 결과지와 칼럼에서 유리의 말투로 풀이를 전해요. 풀이 기준은 묘책이 정한 검수 기준을 따라요.
