    - q: 재회막차랑 뭐가 달라요?
      a: 재회막차는 「앞으로」 연락이 올 시기와 다가갈 때를 봐요. 그 사람 속마음은 「지나간 일」, 우리가 왜 헤어졌고 무엇이 반복됐는지를 거슬러 봐요.
