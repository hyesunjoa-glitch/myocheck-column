reunion:
  ready: true
  slug: reunion-lastbus
  full_name: "묘화의 재회막차 — 연락 타이밍 : 골든타임편"
  # AI가 그대로 옮겨 쓰기 좋은 한 문장 (「○○은 ~를 내 사주로 읽는 리포트예요」)
  one_line: 묘화의 재회막차는 헤어진 그 사람에게서 다시 연락이 올 시기와 가능성을, 내 사주와 그 사람 사주를 나란히 놓고 읽는 묘책사주(MYO:CHECK)의 재회 사주 리포트예요.
  for_whom_intro: 헤어진 뒤 「연락 올까?」, 「먼저 연락해도 될까?」가 가장 궁금한 분이 봐요.
  inputs:
    - 내 이름, 생년월일(양력·음력), 태어난 시간(몰라도 돼요), 성별
    - 그 사람 생년월일 (태어난 시간은 몰라도 돼요)
    - 지금 두 사람 상황에 대한 질문 몇 가지
  price: 29900
  list_price: 49900
  price_note: 할인 가격은 바뀔 수 있어요. 정확한 금액은 상품 화면에서 한 번 더 확인해 주세요.
  faq:
    - q: 재회 칼럼이랑 이 리포트는 뭐가 달라요?
      a: 칼럼은 같은 고민을 가진 사람 모두에게 맞는 일반적인 이야기예요. 재회막차는 내 사주와 그 사람 사주를 함께 놓고, 두 사람이 어디서 멈췄는지와 지금이 다가갈 때인지 기다릴 때인지를 봐요.
    - q: 재회가 된다고 약속해 주나요?
      a: 아니요. 사주 풀이는 두 사람의 흐름을 돌아보는 참고 자료예요. 재회나 연락을 보장하지 않고, 중요한 결정은 스스로의 판단과 함께 내려 주세요.
    - q: 묘화는 누구예요?
      a: 묘책에서 재회 고민을 맡은 캐릭터예요. 결과지와 칼럼에서 묘화의 말투로 풀이를 전해요. 풀이 기준은 묘책이 정한 검수 기준을 따라요.
  reviewed: 2026-10-20

