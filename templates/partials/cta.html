<aside class="product" aria-label="연결 상품">
  {% if product.image %}<img class="product-img" src="{{ root }}{{ product.image }}" alt="{{ product.name }}" loading="lazy">{% endif %}
  <div class="product-body">
    <p class="product-kicker">이 글과 이어지는 사주</p>
    <p class="product-name">{{ product.name }}</p>
    {% if product.edition %}<p class="product-edition">{{ product.edition }}</p>{% endif %}
    <p class="product-hook">{{ product.hook }}</p>
    <a class="product-btn" href="{{ cta_url[position] }}" data-cta="{{ position }}" data-product="{{ product_key }}" data-column="{{ col.slug }}">{{ product.button }}</a>
    {% if not product.url %}<p class="pending-line"><span class="pending">[상품 링크 대기]</span></p>{% endif %}
  </div>
</aside>
