# 검색 노출 스위치
#   false = 검색엔진·AI 봇에게 "아직 보지 마"라고 알림 (도메인 연결 전 시안 단계)
#   true  = 정식 오픈. 도메인(column.myocheck.kr) 연결이 끝난 뒤에만 켜요.
allow_indexing: false

# IndexNow — 새 글이 올라가면 빙·네이버 등에 "새 글 있어요" 하고 바로 알리는 장치
indexnow_key: ba22a96216ed401c42731bf248a0a751
indexnow_enabled: false   # 정식 오픈 때 true

# 구글 애널리틱스(GA4) 측정 ID. 비워두면 추적 코드를 넣지 않아요. (예: G-XXXXXXX)
ga4_id: ""

# 모든 칼럼에 들어가는 "읽기 전에" 상자 (앞의 두 줄만 보이고 나머지는 '더 보기')
notice:
  - 이 칼럼은 실제로 올라온 고민에서 출발해요. 지어낸 사연은 쓰지 않아요.
  - 사주 풀이는 삶의 흐름을 돌아보는 참고 자료예요. 중요한 결정은 스스로의 판단과 함께 내려 주세요.
  - 고민을 옮길 때는 이름·나이·사는 곳처럼 그 사람을 알아볼 수 있는 내용을 지워요.
  - 모든 칼럼은 사람이 읽고 승인한 뒤에 올라가요.

# 칼럼 분류 — 첫 30개: 재회 10 / 이별 원인 10 / 궁합 10
categories:
