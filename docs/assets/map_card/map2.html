<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:540px;height:648px;overflow:hidden;position:relative;font-family:"Noto Sans CJK KR",sans-serif;background:#0A0A0A;color:#fff}
.title{position:absolute;top:62px;left:0;right:0;text-align:center}
.t1{font-size:46px;font-weight:900;letter-spacing:-.035em;line-height:1.25}
.t2{font-size:46px;font-weight:900;letter-spacing:-.035em;line-height:1.25;color:#00FDAA}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center}
.pin img{width:70px;height:80px}
.pin span{margin-top:6px;background:#1E1E1E;color:#fff;font-size:16px;font-weight:800;padding:6px 13px;border-radius:999px;letter-spacing:-.03em;white-space:nowrap;border:1px solid #333}
.bottom{position:absolute;left:0;right:0;bottom:34px;text-align:center}
.sub{font-size:17px;font-weight:600;color:#BDBDBD;letter-spacing:-.03em}
.sub b{color:#fff;font-weight:900}
.btn{margin:14px auto 0;width:400px;padding:14px 0;border-radius:999px;background:#00FDAA;font-size:20px;font-weight:900;color:#0A0A0A;letter-spacing:-.03em}
</style></head><body>
<div class="title"><p class="t1">띠 운세 말고,</p><p class="t2">내 사주로 읽는 답</p></div>
<div class="pin" style="left:52px;top:262px"><img src="pin_msg.svg"><span>연락 올까?</span></div>
<div class="pin" style="left:214px;top:312px"><img src="pin_heart.svg"><span>우리 맞을까?</span></div>
<div class="pin" style="left:388px;top:250px"><img src="pin_cal.svg"><span>내년엔?</span></div>
<div class="bottom">
 <p class="sub"><b>묘책 칼럼</b> · 실제 고민에 사주로 답했어요</p>
 <div class="btn">무료로 읽으러 가기 →</div>
</div>
</body></html>
