<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:540px;height:648px;overflow:hidden;font-family:"Noto Sans CJK KR",sans-serif;color:#fff;
 background:radial-gradient(120% 70% at 50% -5%,rgba(0,253,170,.30),rgba(0,253,170,0) 60%),linear-gradient(#111312,#0A0A0A);position:relative}
.ring{position:absolute;left:50%;top:420px;border:1px solid rgba(0,253,170,.10);border-radius:50%;transform:translate(-50%,-50%)}
.tag{position:absolute;top:58px;left:50%;transform:translateX(-50%);border:1.5px solid #00FDAA;color:#00FDAA;font-size:15px;font-weight:700;padding:4px 14px;border-radius:999px;background:rgba(0,253,170,.08);white-space:nowrap}
h1{position:absolute;top:104px;left:0;right:0;text-align:center;font-size:44px;line-height:1.24;font-weight:900;letter-spacing:-.04em}
h1 em{font-style:normal;color:#00FDAA}
.chips{position:absolute;top:290px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.chip{font-size:22px;font-weight:800;letter-spacing:-.03em;padding:13px 24px;border-radius:18px;background:#1C1F1E;color:#9AA3A0;border:1.5px solid #2C3230}
.chip.on{background:#0A0A0A;color:#fff;border:2px solid #00FDAA;box-shadow:0 0 0 4px rgba(0,253,170,.12),0 0 28px rgba(0,253,170,.45)}
.chip:nth-child(1){transform:translateX(-46px)}
.chip:nth-child(2){transform:translateX(38px)}
.chip:nth-child(3){transform:translateX(-14px)}
.foot{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:15px;color:#8A8F8D;font-weight:500}
.foot b{color:#00FDAA;font-weight:700}
</style></head><body>
<div class="ring" style="width:300px;height:300px"></div><div class="ring" style="width:470px;height:470px"></div><div class="ring" style="width:640px;height:640px"></div>
<div class="tag">묘책 칼럼</div>
<h1>띠 운세 말고,<br><em>내 사주</em>로 읽는 답</h1>
<div class="chips">
 <div class="chip on">연락 올까?</div>
 <div class="chip">우리 맞을까?</div>
 <div class="chip">내년엔?</div>
</div>
<div class="foot">실제 고민에 답한 칼럼 <b>무료로 읽기 →</b></div>
</body></html>
